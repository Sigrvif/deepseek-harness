# The filesystem fixture supplies execution coordinates without a remote service.
# fork(sandbox-removal): the base composition's filesystem row is `fs-local`
# here (upstream: `fs-sandbox`); disable the fork's row so the provider-owned
# filesystem below is the session's only filesystem.
- id: fs-sandbox
  disabled: true
- id: fs-local
  disabled: true

- insert:
    - id: provider-cwd-fs
      name: '../../../packages/bundle/headless/tests/fixtures/provider-cwd.ts'
      config:
        root: !!js process.env.DSH_SNAPSHOT_PROVIDER_CWD
